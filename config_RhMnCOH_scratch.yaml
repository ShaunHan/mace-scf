# v371: independent physical observations; reference-free 50-step validation.
heads:
  default:
    arrays_keys:
      forces: vasp_forces
    info_keys:
      dipole: vasp_dipole
      dipole_correction_zfrac: dipole_correction_zfrac
      dipole_weight: config_dipole_weight
      energy: vasp_free_energy
      fourier_density: vasp_rho_fftn_shifted_1.5
      total_charge: total_charge
seed: 7777
device: cuda
enable_cueq: true
default_dtype: float64
model: FixedPoint
hidden_irreps: 64x0e + 64x1o
MLP_irreps: 64x0e
num_interactions: 2
num_radial_basis: 8
r_max: 6.0
compute_avg_num_neighbors: true
atomic_multipoles_max_l: 1
atomic_multipoles_smearing_width: 1.5
field_feature_widths: '[1.5, 3.0]'
field_feature_max_l: 1
field_feature_norms: None
atom_density_scaling: None
kspace_cutoff_factor: 1.0
include_electrostatic_self_interaction: true
include_local_electron_energy: false
electrostatic_pbc_method: mixed_periodic
fixed_point_update_config:
  type: CoupledResponse
  potential_widths: '[]'
batch_size: 8
valid_batch_size: 4
lr: 0.003
optimizer: adamw
scheduler: none
weight_decay: 0.001
field_block_weight_decay: 0.01
local_charges_weight_decay: 0.0
ema: true
ema_decay: 0.99
clip_grad: 10.0
amsgrad: false
eval_interval: 5
patience: 1000
max_num_epochs: 500
restart_latest: false
save_cpu: true
keep_checkpoints: false
error_table: ElectrostaticRMSE
valid_set_seed: 7777
checkpoints_dir: checkpoints_RhMnCOH_scratch_v371
compute_forces: true
train_schedule:
  0:
    name: stage1
    start: 0
    end: 49
    lr: 0.003
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density: 10
    fixed_point_training_options:
      mode: unroll_scf
      scf:
        num_scf_steps: 12
        constant_charge: true
        mixing_parameter: 0.5
        initial_density: local_guess
        initial_fermi_level: zero
        use_autograd_forces: true
  1:
    name: stage2
    start: 50
    end: 499
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density: 10
    fixed_point_training_options:
      mode: unroll_scf
      scf:
        num_scf_steps: 25
        constant_charge: true
        mixing_parameter: 0.5
        initial_density: local_guess
        initial_fermi_level: zero
        use_autograd_forces: true
  2:
    name: stage3
    start: 500
    end: 550
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density: 10
    fixed_point_training_options:
      mode: unroll_scf
      scf:
        num_scf_steps: 50
        constant_charge: true
        mixing_parameter: 0.5
        initial_density: local_guess
        initial_fermi_level: zero
        use_autograd_forces: true
