heads:
  default:
    arrays_keys:
      forces: vasp_forces
    info_keys:
      energy: vasp_free_energy
      dipole: vasp_dipole
      external_field: external_field
      fermi_level: vasp_efermi
      vacuum_potential: vasp_vacuum_potential
      band_gap: vasp_band_gap
      fourier_density: vasp_rho_fftn_shifted
      fourier_potential: vasp_phi_fftn_shifted
      fourier_proto_potential: vasp_proto_phi_fftn_shifted
      total_charge: total_charge
      counter_charge: counter_charge
      counter_charge_width: counter_charge_width
      counter_charge_fraction: counter_charge_zfrac
      dipole_correction_fraction: dipole_correction_zfrac
seed: 7777
device: cuda
enable_cueq: true
default_dtype: float64
model: PotentialResponse
hidden_irreps: 64x0e + 64x1o
MLP_irreps: 64x0e
num_interactions: 2
num_radial_basis: 8
r_max: 6.0
compute_avg_num_neighbors: true
atomic_multipoles_max_l: 1
atomic_multipoles_smearing_width: 1.5
field_feature_widths: '[1.5, 3.0]'
kspace_cutoff_factor: 1.0
batch_size: 16
valid_batch_size: 16
lr: 0.003
optimizer: adamw
amsgrad: false
scheduler: ExponentialLR
lr_scheduler_gamma: 1.0
weight_decay: 0.001
field_block_weight_decay: 0.01
ema: true
ema_decay: 0.99
clip_grad: 10.0
eval_interval: 5
patience: 1000
max_num_epochs: 301
restart_latest: false
save_cpu: true
keep_checkpoints: true
save_all_checkpoints: false
error_table: WorkFunctionRMSE
valid_set_seed: 7777
checkpoints_dir: checkpoints
log_dir: logs
results_dir: results
model_dir: models
train_schedule:
  0:
    name: stage1
    start: 0
    end: 49
    lr: 0.003
    loss:
      energy_per_atom: 100.0
      forces: 500.0
      dipole: 10.0
      fourier_density:
        weight: 10.0
        smearing_widths: [3.0]
      fourier_potential:
        weight: 100.0
        smearing_widths: [0.0, 1.5]
      vacuum_potential: 100.0
      fermi_level: 100.0
      band_gap: 10.0
  1:
    name: stage2
    start: 50
    end: 149
    lr: 0.001
    loss:
      energy_per_atom: 100.0
      forces: 500.0
      dipole: 100.0
      fourier_density:
        weight: 100.0
        smearing_widths: [3.0]
      fourier_potential:
        weight: 100.0
        smearing_widths: [0.0, 1.5]
      vacuum_potential: 100.0
      fermi_level: 100.0
      band_gap: 10.0
  2:
    name: stage3
    start: 150
    end: 249
    lr: 0.001
    loss:
      energy_per_atom: 500.0
      forces: 500.0
      dipole: 500.0
      fourier_density:
        weight: 100.0
        smearing_widths: [3.0]
      fourier_potential:
        weight: 100.0
        smearing_widths: [0.0, 1.5]
      vacuum_potential: 100.0
      fermi_level: 100.0
      band_gap: 10.0
  3:
    name: stage4
    start: 250
    end: 300
    lr: 0.0005
    loss:
      energy_per_atom: 1000.0
      forces: 500.0
      dipole: 500.0
      fourier_density:
        weight: 100.0
        smearing_widths: [3.0]
      fourier_potential:
        weight: 100.0
        smearing_widths: [0.0, 1.5]
      vacuum_potential: 100.0
      fermi_level: 100.0
      band_gap: 10.0
potential_response_config:
  fixed_point: true
