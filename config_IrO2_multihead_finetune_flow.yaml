heads:
  default:
    arrays_keys:
      forces: vasp_forces
    info_keys:
      dipole: vasp_dipole
      dipole_correction_zfrac: dipole_correction_zfrac
      dipole_weight: config_dipole_weight
      energy: vasp_free_energy
      external_field: external_field
      fermi_level: vasp_efermi
      fourier_density: vasp_rho_fftn_shifted
      fourier_potential: vasp_phi_fftn_shifted
      # The neutral atoms of the DFT runs, written by scripts/collect_vasp_data.py.
      fourier_proto_potential: vasp_proto_phi_fftn_shifted
      total_charge: total_charge
      vacuum_zfrac: vacuum_zfrac
      vacuum_potential: vacuum_potential
      counter_charge: counter_charge
      counter_charge_width: counter_charge_width
      counter_charge_zfrac: counter_charge_zfrac
      counter_charge_center: counter_charge_center
  pt_head:
    info_keys:
      energy: dft_free_energy
      total_charge: charge
      total_spin: spin
      external_field: external_field
    arrays_keys:
      forces: dft_forces
seed: 7777
device: cuda
enable_cueq: true
default_dtype: float64
model: FixedPoint
hidden_irreps: 64x0e + 64x1o
MLP_irreps: 64x0e
num_interactions: 2
num_radial_basis: 8
r_max: 6.0
compute_avg_num_neighbors: true
atomic_multipoles_max_l: 1
atomic_multipoles_smearing_width: 1.5
field_feature_widths: '[1.5, 3.0]'
field_feature_max_l: 1
field_feature_norms: None
atom_density_scaling: None
kspace_cutoff_factor: 1.0
include_electrostatic_self_interaction: true
include_local_electron_energy: false
electrostatic_pbc_method: mixed_periodic
fixed_point_update_config:
  type: ChargeFlowResponse
  flow_cutoff: 4.0
potential_amplitudes_smearing_width: 1.5
batch_size: 8
valid_batch_size: 8
lr: 0.001
optimizer: adamw
scheduler: none
weight_decay: 0.001
field_block_weight_decay: 0.01
local_charges_weight_decay: 0.0
ema: true
ema_decay: 0.99
clip_grad: 10.0
amsgrad: false
eval_interval: 5
patience: 1000
max_num_epochs: 301
restart_latest: false
save_cpu: true
keep_checkpoints: true
save_all_checkpoints: true
error_table: ElectrostaticRMSE
valid_set_seed: 7777
checkpoints_dir: checkpoints
compute_forces: true
foundation_model: /fs/cephfs/data/qm_inorganics/mace_models/MACE-POLAR-1-M.model
multiheads_finetuning: true
pseudolabel_replay: true
force_mh_ft_lr: true
pt_train_file: /fs/cephfs/data/qm_inorganics/shuang/electrocatalysis/IrO2_110/ml_training/data/replay/pt_train.xyz
pt_valid_file: /fs/cephfs/data/qm_inorganics/shuang/electrocatalysis/IrO2_110/ml_training/data/replay/pt_valid.xyz
energy_weight: 1.0
forces_weight: 100.0
weight_pt_head: 1.0
filter_type_pt: none
subselect_pt: random
log_dir: logs
results_dir: results
model_dir: models
train_schedule:
  0:
    name: heads
    start: 0
    end: 9
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density:
        weight: 10
        reference: farfield
      fourier_potential:
        weight: 100
        reference: raw+smeared
      vacuum_potential: 100
      fermi_level: 100
    fixed_point_training_options:
      mode: direct
    freeze_foundation_backbone: true
    checkpoint_metric: rmse_wf_abs
  1:
    name: stage1
    start: 10
    end: 49
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density:
        weight: 10
        reference: farfield
      fourier_potential:
        weight: 100
        reference: raw+smeared
      vacuum_potential: 100
      fermi_level: 100
    fixed_point_training_options:
      mode: direct
    checkpoint_metric: rmse_wf_abs
  2:
    name: stage2
    start: 50
    end: 149
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 100
      fourier_density:
        weight: 100
        reference: farfield
      fourier_potential:
        weight: 100
        reference: raw+smeared
      vacuum_potential: 100
      fermi_level: 100
    fixed_point_training_options:
      mode: direct
    checkpoint_metric: rmse_wf_abs
  3:
    name: stage3
    start: 150
    end: 249
    lr: 0.001
    loss:
      energy_per_atom: 500
      forces: 500
      dipole: 500
      fourier_density:
        weight: 100
        reference: farfield
      fourier_potential:
        weight: 100
        reference: raw+smeared
      vacuum_potential: 100
      fermi_level: 100
    fixed_point_training_options:
      mode: direct
    checkpoint_metric: rmse_wf_abs
  4:
    name: stage4
    start: 250
    end: 300
    lr: 0.0005
    loss:
      energy_per_atom: 1000
      forces: 500
      dipole: 500
      fourier_density:
        weight: 100
        reference: farfield
      fourier_potential:
        weight: 100
        reference: raw+smeared
      vacuum_potential: 100
      fermi_level: 100
    fixed_point_training_options:
      mode: direct
    checkpoint_metric: rmse_wf_abs
