# v367: apply to released mace_scf. Validation and export use 50 electronic steps.
heads:
  default:
    arrays_keys:
      forces: vasp_forces
    info_keys:
      dipole: vasp_dipole
      dipole_correction_zfrac: dipole_correction_zfrac
      dipole_weight: config_dipole_weight
      energy: vasp_free_energy
      fourier_density: vasp_rho_fftn_shifted_1.5
      total_charge: total_charge
name: RhMnCOH_v367_finetune
seed: 950418
device: cuda
default_dtype: float64
model: FixedPoint
hidden_irreps: 64x0e + 64x1o
MLP_irreps: 64x0e
num_interactions: 2
num_radial_basis: 8
r_max: 6.0
E0s: average
compute_avg_num_neighbors: true
atomic_multipoles_max_l: 1
atomic_multipoles_smearing_width: 1.5
field_feature_widths: '[1.5, 3.0]'
field_feature_max_l: 1
field_feature_norms: None
atom_density_scaling: None
kspace_cutoff_factor: 1.0
include_electrostatic_self_interaction: true
include_local_electron_energy: false
electrostatic_pbc_method: mixed_periodic
fixedpoint_update_config:
  type: VariationalResponse
  potential_widths: []
batch_size: 1
valid_batch_size: 1
lr: 0.001
optimizer: adamw
scheduler: none
weight_decay: 0.001
field_block_weight_decay: 0.01
local_charges_weight_decay: 0.0
ema: true
ema_decay: 0.99
clip_grad: 10.0
amsgrad: false
eval_interval: 5
patience: 1000
max_num_epochs: 500
restart_latest: false
save_cpu: true
keep_checkpoints: false
error_table: ElectrostaticRMSE
valid_set_seed: 950418
checkpoints_dir: checkpoints_RhMnCOH_finetune_v367
compute_forces: true
foundation_model: MACE-POLAR-1-M.model
train_schedule:
  0:
    name: RhMnCOH_v367_stage1
    start: 0
    end: 499
    lr: 0.001
    loss:
      energy_per_atom: 100
      forces: 500
      dipole: 10
      fourier_density: 10
    fixed_point_training_options:
      mode: implicit
      scf:
        num_scf_steps: 50
        constant_charge: true
        initial_density: local_guess
        initial_fermi_level: zero
        use_autograd_forces: true
train_file: RhMnCOH_train.xyz
valid_file: RhMnCOH_valid.xyz
